    <script>
      (function () {
        // Yangi (o'qilmagan) foydalanuvchi xabarlari soni — har bir admin
        // sahifasida darhol ko'rinishi va vaqti-vaqti bilan yangilanib turishi
        // uchun (admin sahifani ochiq qoldirsa ham yangi xabarni sezadi).
        const badge = document.getElementById("admin-unread-badge");
        if (!badge) return;
        async function refreshUnreadCount() {
          try {
            const res = await fetch("{{ admin_prefix }}/api/messages/unread-count");
            if (!res.ok) return;
            const data = await res.json();
            if (data.count > 0) {
              badge.textContent = data.count > 99 ? "99+" : String(data.count);
              badge.hidden = false;
            } else {
              badge.hidden = true;
            }
          } catch (e) { /* jimgina o'tkazib yuboramiz — tarmoq muammosi bo'lishi mumkin */ }
        }
        refreshUnreadCount();
        setInterval(refreshUnreadCount, 30000);
      })();
      (function () {
        const b = document.getElementById("admin-reports-badge");
        if (!b) return;
        async function r() {
          try {
            const res = await fetch("{{ admin_prefix }}/api/reports/count");
            if (!res.ok) return;
            const d = await res.json();
            b.textContent = d.count > 99 ? "99+" : String(d.count);
            b.hidden = !(d.count > 0);
          } catch (e) {}
        }
        r(); setInterval(r, 45000);
      })();
    </script>
