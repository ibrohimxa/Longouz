<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin kirish — LongoUZ</title>
  <link rel="icon" type="image/png" href="/static/logo-owl.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=229">
  <script src="/static/theme-init.js?v=229"></script>
</head>
<body>
  <main>
    <div class="auth-wrap">
      <div class="admin-login-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Admin panel
      </div>

      <h1>Boshqaruv paneliga kirish</h1>
      <p class="auth-sub">Bu sahifa faqat LongoUZ administratori uchun.</p>

      {% if error %}<div class="form-error">{{ error }}</div>{% endif %}

      <form method="post" action="{{ admin_prefix }}/login" id="admin-login-form">
        <div class="field">
          <label for="username">Login</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Parol</label>
          <div class="password-field-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="password-toggle-btn" aria-label="Parolni ko'rsatish" data-target="password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary">Kirish</button>
      </form>

      <a href="/" class="auth-back" style="margin-top:20px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Saytga qaytish
      </a>
    </div>
  </main>

  <script src="/static/devtools-guard.js"></script>
  <script>
    // Faqat parolni ko'rsatish/yashirish tugmasi (boyqush yo'q — admin
    // sahifasi ataylab jiddiy va minimal ko'rinishda).
    document.querySelectorAll(".password-toggle-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.getAttribute("data-target"));
        if (!input) return;
        input.type = input.type === "password" ? "text" : "password";
      });
    });
  </script>
</body>
</html>
